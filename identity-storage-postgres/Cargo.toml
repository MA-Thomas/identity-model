[package]
name = "identity-storage-postgres"
version = "0.1.0"
edition = "2021"
[dependencies]
identity-contract = { path = "../identity-contract" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
identity-application = { path = "../identity-application" }
identity-model = { path = "../identity-model" }
fen-core = { path = "../fen-core" }
fen-store = { path = "../fen-store" }
fen-store-postgres = { path = "../fen-store-postgres" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
