[package]
name = "identity-enrollment"
version = "0.1.0"
edition = "2021"

[dependencies]
identity-storage-postgres = { path = "../identity-storage-postgres" }
identity-application = { path = "../identity-application" }
identity-contract = { version = "0.1.0", path = "../identity-contract" }
identity-model = { path = "../identity-model" }
identity-adapters = { path = "../identity-adapters" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
