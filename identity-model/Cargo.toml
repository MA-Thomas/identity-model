[package]
name = "identity-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
fen-core = { path = "../fen-core" }
fen-store = { path = "../fen-store" }

[dev-dependencies]
identity-application = { path = "../identity-application" }
identity-test-support = { path = "../identity-test-support" }
# Test-only pure-Rust P-384 signer used to reproduce Apple's real App Attest
# certificate chain shape (a P-256 leaf signed by a P-384 intermediate with
# ecdsa-with-SHA256). `ring` can only sign the two matched curve/digest
# combinations, which is exactly why the all-P-256 fixtures missed the bug.
p384 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

identity-adapters = { path = "../identity-adapters" }
identity-storage-postgres = { path = "../identity-storage-postgres" }
identity-server = { path = "../identity-server" }
fen-store = { path = "../fen-store", features = ["production-crypto"] }
serde_json = "1"
jsonwebtoken = "9.3.1"
ring = "0.17.14"
ed25519-dalek = "2.2.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
fen-store-postgres = { path = "../fen-store-postgres" }
