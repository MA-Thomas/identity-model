name: ci
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p identity-model --lib --no-default-features
      - run: cargo check -p identity-application --lib --no-default-features
      - run: cargo test --workspace
      - run: cargo fmt --all --check
      - run: cargo clippy -p identity-application -p identity-contract -p identity-enrollment --all-targets --no-deps -- -D warnings
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [identity-adapters, identity-storage-postgres, identity-server]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ${{ matrix.crate }} --all-targets
  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U identity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IDENTITY_MODEL_POSTGRES_URL: postgres://identity:identity@127.0.0.1:5432/identity
      IDENTITY_REQUIRE_POSTGRES_TESTS: '1'
      IDENTITY_REQUIRE_PROVIDER_TESTS: '1'
      IDENTITY_MODEL_KEYCLOAK_ISSUER: http://localhost:8080/realms/identity-ci
      IDENTITY_MODEL_KEYCLOAK_CLIENT_ID: identity-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start isolated OIDC provider
        run: |
          docker run -d --name identity-ci-oidc -p 8080:8080 \
            -v "$PWD/ci/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.0.7 start-dev --import-realm
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$IDENTITY_MODEL_KEYCLOAK_ISSUER/.well-known/openid-configuration" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent "$IDENTITY_MODEL_KEYCLOAK_ISSUER/.well-known/openid-configuration" >/dev/null
          token=$(curl --fail --silent "$IDENTITY_MODEL_KEYCLOAK_ISSUER/protocol/openid-connect/token" \
            --data-urlencode client_id=identity-ci --data-urlencode username=identity-ci \
            --data-urlencode password=ci-local-only --data-urlencode grant_type=password | jq -er .access_token)
          echo "::add-mask::$token"
          echo "IDENTITY_MODEL_KEYCLOAK_TOKEN=$token" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features -- --test-threads=1
      - if: failure()
        run: docker logs identity-ci-oidc
